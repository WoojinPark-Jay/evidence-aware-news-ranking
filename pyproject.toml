[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-aware-news-ranking"
version = "0.1.0"
description = "Source-separated evidence fusion for candidate-level ranking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
mind = [
  "sentence-transformers>=3.0",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
